<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Transação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">💰 Finanças SyS</a>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">Voltar ao Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Adicionar Receita ou Despesa</h5>
                    </div>
                    <div class="card-body">
                        <form action="/nova_transacao" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label">Descrição (Ex: Conta de Água, Salário)</label>
                                <input type="text" class="form-control" name="descricao" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Valor (R$)</label>
                                    <input type="number" step="0.01" class="form-control" name="valor" required placeholder="0.00">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Data</label>
                                    <input type="date" class="form-control" name="data_transacao" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Tipo</label>
                                <select class="form-select" name="tipo" required>
                                    <option value="despesa">Despesa (Saída)</option>
                                    <option value="receita">Receita (Entrada)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Categoria</label>
                                <select class="form-select" name="categoria_id" required>
                                    {% for c in categorias %}
                                        <option value="{{ c.id }}">{{ c.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Conta de Pagamento</label>
                                <select class="form-select" name="conta_id" required>
                                    {% for c in contas %}
                                        <option value="{{ c.id }}">{{ c.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Salvar Transação</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
