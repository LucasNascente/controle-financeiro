{% extends "base.html" %}
{% set active_page = 'nova_transacao' %}
{% block title %}Nova transação · Controle Financeiro{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <p class="eyebrow">Movimentação</p>
        <h1 class="page-title">Nova transação</h1>
    </div>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-ghost btn-sm">Cancelar</a>
</div>

<div class="card" style="max-width: 560px;">
    {% if erro %}<div class="alert alert-error">{{ erro }}</div>{% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="auth-field">
            <label>Descrição</label>
            <input type="text" name="descricao" placeholder="Ex: Aluguel, Supermercado..." required style="width:100%;">
        </div>

        <div style="display:flex; gap:14px;">
            <div class="auth-field" style="flex:1;">
                <label>Valor (R$)</label>
                <input type="text" name="valor" placeholder="0,00" required style="width:100%;">
            </div>
            <div class="auth-field" style="flex:1;">
                <label>Data</label>
                <input type="date" name="data_transacao" required style="width:100%;">
            </div>
        </div>

        <div class="auth-field">
            <label>Tipo</label>
            <select name="tipo" style="width:100%;">
                <option value="despesa">Despesa (saída)</option>
                <option value="receita">Receita (entrada)</option>
            </select>
        </div>

        <div class="auth-field">
            <label>Categoria</label>
            <select name="categoria_id" style="width:100%;">
                {% for c in categorias %}
                    <option value="{{ c.id }}">{{ c.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="auth-field">
            <label>Conta</label>
            <select name="conta_id" style="width:100%;">
                {% for c in contas %}
                    <option value="{{ c.id }}">{{ c.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;">Salvar transação</button>
    </form>
</div>
{% endblock %}
