{% extends "base.html" %}
{% set active_page = 'dashboard' %}
{% block title %}Editar transação · Controle Financeiro{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <p class="eyebrow">Movimentação</p>
        <h1 class="page-title">Editar transação</h1>
    </div>
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost btn-sm">Cancelar e voltar</a>
</div>

<div class="card" style="max-width: 560px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="auth-field">
            <label>Descrição</label>
            <input type="text" name="descricao" value="{{ transacao.descricao }}" required style="width:100%;">
        </div>

        <div style="display:flex; gap:14px;">
            <div class="auth-field" style="flex:1;">
                <label>Valor (R$)</label>
                <input type="text" name="valor" value="{{ transacao.valor }}" required style="width:100%;">
            </div>
            <div class="auth-field" style="flex:1;">
                <label>Data</label>
                <input type="date" name="data_transacao" value="{{ transacao.data_transacao }}" required style="width:100%;">
            </div>
        </div>

        <div class="auth-field">
            <label>Tipo</label>
            <select name="tipo" style="width:100%;">
                <option value="despesa" {% if transacao.tipo == 'despesa' %}selected{% endif %}>Despesa (saída)</option>
                <option value="receita" {% if transacao.tipo == 'receita' %}selected{% endif %}>Receita (entrada)</option>
            </select>
        </div>

        <div class="auth-field">
            <label>Categoria</label>
            <select name="categoria_id" style="width:100%;">
                {% for c in categorias %}
                    <option value="{{ c.id }}" {% if c.id == transacao.categoria_id %}selected{% endif %}>{{ c.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <input type="hidden" name="conta_id" value="1">
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;">Atualizar transação</button>
    </form>
</div>
{% endblock %}
