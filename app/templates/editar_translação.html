<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFinance - Editar Transação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); max-width: 600px; margin: auto; }
        .navbar { background-color: #0d6efd !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="{{ url_for('dashboard') }}">💰 MyFinance</a>
        <div class="ms-auto">
            <a href="{{ url_for('dashboard') }}" class="btn btn-light btn-sm fw-semibold">Cancelar e Voltar</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card card-custom p-4 bg-white">
        <h4 class="fw-bold mb-4">✏️ Editar Movimentação</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Descrição</label>
                <input type="text" name="descricao" class="form-control" value="{{ transacao.descricao }}" required>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Valor (R$)</label>
                    <input type="text" name="valor" class="form-control" value="{{ transacao.valor }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Data</label>
                    <input type="date" name="data_transacao" class="form-control" value="{{ transacao.data_transacao }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Tipo</label>
                <select name="tipo" class="form-select">
                    <option value="despesa" {% if transacao.tipo == 'despesa' %}selected{% endif %}>Despesa (Saída)</option>
                    <option value="receita" {% if transacao.tipo == 'receita' %}selected{% endif %}>Receita (Entrada)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Categoria</label>
                <select name="categoria_id" class="form-select">
                    {% for c in categorias %}
                        <option value="{{ c.id }}" {% if c.id == transacao.categoria_id %}selected{% endif %}>{{ c.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <input type="hidden" name="conta_id" value="1"> 
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-3 text-dark">Atualizar Transação</button>
        </form>
    </div>
</div>

</body>
</html>
