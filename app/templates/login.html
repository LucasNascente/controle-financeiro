<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card-login {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="card card-login p-4 bg-white">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">MyFinance</h3>
        <p class="text-muted small">Faça login para aceder à sua conta</p>
    </div>

    {% if erro %}
        <div class="alert alert-danger py-2" role="alert">
            {{ erro }}
        </div>
    {% endif %}

    {% if sucesso %}
        <div class="alert alert-success py-2" role="alert">
            {{ sucesso }}
        </div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="mb-3">
            <label class="form-label fw-semibold">E-mail</label>
            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Senha</label>
            <div class="input-group">
                <input type="password" name="senha" id="campoSenhaLogin" class="form-control" placeholder="Digite a sua senha" required>
                <button class="btn btn-outline-secondary" type="button" onclick="toggleSenha('campoSenhaLogin', 'iconeSenhaLogin')">
                    <span id="iconeSenhaLogin">👁️</span>
                </button>
            </div>
            <div class="text-end mt-1">
                <a href="{{ url_for('esqueci_senha') }}" class="text-decoration-none small text-muted">Esqueci-me da senha</a>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Entrar</button>

        <div class="text-center">
            <span class="text-muted small">Ainda não tem conta?</span>
            <a href="{{ url_for('cadastro') }}" class="text-decoration-none small fw-semibold">Criar Conta</a>
        </div>
    </form>
</div>

<script>
function toggleSenha(inputId, iconeId) {
    const input = document.getElementById(inputId);
    const icone = document.getElementById(iconeId);
    
    if (input.type === 'password') {
        input.type = 'text';
        icone.textContent = '🙈';
    } else {
        input.type = 'password';
        icone.textContent = '👁️';
    }
}
</script>

</body>
</html>
