<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Controle Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand"><span class="dot"></span> Controle Financeiro</div>
        <p class="auth-sub">Entre para ver seu saldo, receitas e despesas.</p>

        {% if erro %}<div class="alert alert-error">{{ erro }}</div>{% endif %}
        {% if sucesso %}<div class="alert alert-success">{{ sucesso }}</div>{% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="auth-field">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="voce@email.com" required>
            </div>
            <div class="auth-field">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Entrar</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('cadastro') }}">Criar conta</a>
            <a href="{{ url_for('esqueci_senha') }}">Esqueci minha senha</a>
        </div>
    </div>
</div>
</body>
</html>
