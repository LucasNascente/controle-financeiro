<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Controle Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card-cadastro {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="card card-cadastro p-4 bg-white">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">Criar Nova Conta</h3>
        <p class="text-muted small">Registe-se para gerir as suas finanças</p>
    </div>

    {% if erro %}
        <div class="alert alert-danger py-2" role="alert">
            {{ erro }}
        </div>
    {% endif %}

    <form action="{{ url_for('cadastro') }}" method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Nome Completo</label>
            <input type="text" name="nome" class="form-control" placeholder="O seu nome" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">E-mail</label>
            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Senha</label>
            <div class="input-group">
                <input type="password" name="senha" id="campoSenhaCad" class="form-control" placeholder="Crie uma senha segura" required>
                <button class="btn btn-outline-secondary" type="button" onclick="toggleSenha('campoSenhaCad', 'iconeSenhaCad')">
                    <span id="iconeSenhaCad">👁️</span>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Cadastrar</button>

        <div class="text-center">
            <span class="text-muted small">Já tem uma conta?</span>
            <a href="{{ url_for('index') }}" class="text-decoration-none small fw-semibold">Fazer Login</a>
        </div>
    </form>
</div>

<script>
function toggleSenha(inputId, iconeId) {
    const input = document.getElementById(inputId);
    const icone = document.getElementById(iconeId);
    
    if (input.type === 'password') {
        input.type = 'text';
        icone.textContent = '🙈';
    } else {
        input.type = 'password';
        icone.textContent = '👁️';
    }
}
</script>

</body>
</html>
