<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta · Controle Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand"><span class="dot"></span> Controle Financeiro</div>
        <p class="auth-sub">Crie sua conta para começar a organizar suas finanças.</p>

        {% if erro %}<div class="alert alert-error">{{ erro }}</div>{% endif %}

        <form action="{{ url_for('auth.cadastro') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="auth-field">
                <label>Nome completo</label>
                <input type="text" name="nome" placeholder="Seu nome" required>
            </div>

            <div class="auth-field">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="voce@email.com" required>
            </div>

            <div class="auth-field">
                <label>Senha</label>
                <div style="position:relative;">
                    <input type="password" name="senha" id="campoSenhaCad" placeholder="Crie uma senha segura" required style="width:100%; padding-right:44px;">
                    <button type="button" onclick="toggleSenha('campoSenhaCad', 'iconeSenhaCad')"
                        style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:15px;">
                        <span id="iconeSenhaCad">👁️</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit">Cadastrar</button>
        </form>

        <div class="auth-links" style="justify-content:center;">
            <span style="color:var(--text-faint);">Já tem uma conta?&nbsp;</span><a href="{{ url_for('auth.index') }}">Fazer login</a>
        </div>
    </div>
</div>

<script>
function toggleSenha(inputId, iconeId) {
    const input = document.getElementById(inputId);
    const icone = document.getElementById(iconeId);
    if (input.type === 'password') {
        input.type = 'text';
        icone.textContent = '🙈';
    } else {
        input.type = 'password';
        icone.textContent = '👁️';
    }
}
</script>
</body>
</html>
