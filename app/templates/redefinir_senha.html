<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha · Controle Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand"><span class="dot"></span> Controle Financeiro</div>
        <p class="auth-sub">Digite sua nova senha abaixo.</p>

        {% if erro %}<div class="alert alert-error">{{ erro }}</div>{% endif %}

        <form action="{{ url_for('auth.redefinir_senha_token', token=token) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="auth-field">
                <label>Nova senha</label>
                <div style="position:relative;">
                    <input type="password" name="nova_senha" id="campoNovaSenha" placeholder="Digite a nova senha" required style="width:100%; padding-right:44px;">
                    <button type="button" onclick="toggleSenha('campoNovaSenha', 'iconeNovaSenha')"
                        style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:15px;">
                        <span id="iconeNovaSenha">👁️</span>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Salvar nova senha</button>
        </form>

        <div class="auth-links" style="justify-content:center;">
            <a href="{{ url_for('auth.index') }}">Cancelar</a>
        </div>
    </div>
</div>

<script>
function toggleSenha(inputId, iconeId) {
    const input = document.getElementById(inputId);
    const icone = document.getElementById(iconeId);
    if (input.type === 'password') {
        input.type = 'text';
        icone.textContent = '🙈';
    } else {
        input.type = 'password';
        icone.textContent = '👁️';
    }
}
</script>
</body>
</html>
