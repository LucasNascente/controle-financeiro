<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha Senha - Controle Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card-reset {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="card card-reset p-4 bg-white">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">Recuperar Senha</h3>
        <p class="text-muted small">Informe seu e-mail cadastrado para receber o link de redefinição</p>
    </div>

    {% if erro %}
        <div class="alert alert-danger py-2" role="alert">
            {{ erro }}
        </div>
    {% endif %}

    {% if sucesso %}
        <div class="alert alert-success py-2" role="alert">
            {{ sucesso }}
        </div>
    {% endif %}

    <form action="{{ url_for('esqueci_senha') }}" method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">E-mail Cadastrado</label>
            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Enviar Link por E-mail</button>

        <div class="text-center">
            <a href="{{ url_for('index') }}" class="text-decoration-none small fw-semibold">Voltar para o Login</a>
        </div>
    </form>
</div>

</body>
</html>
