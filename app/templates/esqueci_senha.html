<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha · Controle Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand"><span class="dot"></span> Controle Financeiro</div>
        <p class="auth-sub">Informe seu e-mail cadastrado para receber o link de redefinição.</p>

        {% if erro %}<div class="alert alert-error">{{ erro }}</div>{% endif %}
        {% if sucesso %}<div class="alert alert-success">{{ sucesso }}</div>{% endif %}

        <form action="{{ url_for('auth.esqueci_senha') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="auth-field">
                <label>E-mail cadastrado</label>
                <input type="email" name="email" placeholder="voce@email.com" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Enviar link por e-mail</button>
        </form>

        <div class="auth-links" style="justify-content:center;">
            <a href="{{ url_for('auth.index') }}">Voltar para o login</a>
        </div>
    </div>
</div>
</body>
</html>
