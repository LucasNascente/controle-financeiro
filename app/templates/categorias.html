<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFinance - Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .navbar { background-color: #0d6efd !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="{{ url_for('dashboard') }}">💰 MyFinance</a>
        <div class="ms-auto">
            <a href="{{ url_for('dashboard') }}" class="btn btn-light btn-sm fw-semibold">Voltar ao Dashboard</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row g-4">
        <div class="col-md-5">
            <div class="card card-custom p-4 bg-white">
                <h4 class="fw-bold mb-3">🏷️ Nova Categoria</h4>
                <form action="{{ url_for('categorias') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome da Categoria</label>
                        <input type="text" name="nome" class="form-control" placeholder="Ex: Lazer, Saúde..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Cor do Gráfico</label>
                        <input type="color" name="cor" class="form-control form-control-color w-100" value="#0d6efd">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Salvar Categoria</button>
                </form>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card card-custom p-4 bg-white">
                <h4 class="fw-bold mb-3">📋 Minhas Categorias</h4>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Cor</th>
                                <th>Nome</th>
                                <th class="text-end">Ação</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cat in categorias %}
                            <tr>
                                <td><div style="width: 20px; height: 20px; border-radius: 50%; background-color: {{ cat.cor }};"></div></td>
                                <td class="fw-semibold">{{ cat.nome }}</td>
                                <td class="text-end">
                                    <form action="{{ url_for('deletar_categoria', id=cat.id) }}" method="POST" class="d-inline">
                                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza que deseja excluir esta categoria?')">🗑️</button>
                                    </form>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="3" class="text-center text-muted py-3">Nenhuma categoria cadastrada.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
